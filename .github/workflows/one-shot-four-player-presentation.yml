name: one-shot four player presentation

on:
  push:
    branches:
      - feature/class-mastery-persistence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/class-mastery-persistence
      - name: Apply presenter and test registration changes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          presenter = Path('core/src/main/kotlin/grandlineduo/appshell/GamePresenter.kt')
          text = presenter.read_text()

          replacements = [
              (
                  '    val playerPosition: GridPosition,\n    val interaction: ExplorationInteraction?,',
                  '    val playerPosition: GridPosition,\n    val playerPositions: Map<String, GridPosition> = emptyMap(),\n    val interaction: ExplorationInteraction?,'
              ),
              (
                  '        require(actorId == "p1" || actorId == "p2") { "Unknown actor" }',
                  '        require(actorId in HUMAN_PLAYER_IDS) { "Unknown actor" }'
              ),
              (
                  '                playerPosition = playerPosition,\n                interaction = interaction,',
                  '                playerPosition = playerPosition,\n                playerPositions = world.players.keys.sorted().associateWith { ExplorationEngine.position(world, it) },\n                interaction = interaction,'
              ),
              (
                  '        val island = GrandLineWorldAtlas.describe(world.campaignId, world.islandId)\n        return buildList {',
                  '        val island = GrandLineWorldAtlas.describe(world.campaignId, world.islandId)\n        val roster = world.players.values.filter { it.profile != null }.sortedBy { it.playerId }\n        return buildList {\n            if (roster.isNotEmpty()) {\n                add("Tripulação ${roster.size}/4")\n                roster.chunked(2).forEach { group ->\n                    add(group.joinToString(" • ") { "${it.playerId.uppercase()} ${it.name}" })\n                }\n            }'
              ),
              (
                  '    private val BASIC_COMBAT_ACTIONS = listOf(',
                  '    private val HUMAN_PLAYER_IDS = setOf("p1", "p2", "p3", "p4")\n\n    private val BASIC_COMBAT_ACTIONS = listOf('
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected presenter fragment not found: {old[:90]!r}')
              text = text.replace(old, new, 1)
          presenter.write_text(text)

          runner = Path('core/src/test/kotlin/grandlineduo/test/TestRunner.kt')
          rtext = runner.read_text()
          old = '    grandlineduo.appshell.GamePresenterTest.register()\n'
          new = old + '    grandlineduo.appshell.FourPlayerPresentationTest.register()\n'
          if old not in rtext:
              raise SystemExit('GamePresenterTest registration not found')
          runner.write_text(rtext.replace(old, new, 1))
          PY
          grep -F 'val playerPositions: Map<String, GridPosition>' core/src/main/kotlin/grandlineduo/appshell/GamePresenter.kt
          grep -F 'FourPlayerPresentationTest.register()' core/src/test/kotlin/grandlineduo/test/TestRunner.kt
      - name: Commit presentation changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/kotlin/grandlineduo/appshell/GamePresenter.kt core/src/test/kotlin/grandlineduo/test/TestRunner.kt
          git commit -m 'feat: present four-player party roster and positions'
          git push origin HEAD:feature/class-mastery-persistence
