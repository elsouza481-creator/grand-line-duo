name: Apply quest UI integration patch

on:
  push:
    branches: ["feature/quest-contract-system"]
    paths:
      - ".github/workflows/quest-ui-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quest-contract-system
          fetch-depth: 0
      - name: Patch session coordinator and Android dispatcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          coordinator = Path('core/src/main/kotlin/grandlineduo/appshell/GameSessionCoordinator.kt')
          text = coordinator.read_text()
          needle = '''    @Synchronized
              fun submitWorldAction(action: String, target: String = "", amount: Int = 1): WorldState {
                  sendGameplay(GameplayWireCommand.WorldAction(nextCommandId("world"), actorId, action, target, amount))
                  return worldState()
              }
          '''.replace('              ', '')
          addition = needle + '''
              @Synchronized
              fun submitQuestAction(action: String, questId: String = "", amount: Int = 1): WorldState {
                  sendGameplay(
                      GameplayWireCommand.QuestAction(
                          commandId = nextCommandId("quest"),
                          actorId = actorId,
                          actionType = action,
                          questId = questId,
                          amount = amount,
                      )
                  )
                  return worldState()
              }
          '''.replace('              ', '')
          if text.count(needle) != 1:
              raise SystemExit('GameSessionCoordinator patch anchor mismatch')
          coordinator.write_text(text.replace(needle, addition, 1))

          activity = Path('app/src/main/kotlin/com/grandlineduo/app/MainActivity.kt')
          text = activity.read_text()
          dispatch_needle = '''                    "VOYAGE" -> coordinator.submitVoyageAction(VoyageAction.valueOf(action.id))
                              "CAMPAIGN" -> coordinator.advanceCampaign()
          '''.replace('                              ', '                    ')
          dispatch_addition = '''                    "VOYAGE" -> coordinator.submitVoyageAction(VoyageAction.valueOf(action.id))
                              "QUEST" -> {
                                  val parts = action.id.split('|', limit = 3)
                                  val actionType = parts[0]
                                  val questId = parts.getOrElse(1) { "" }
                                  val amount = parts.getOrNull(2)?.toIntOrNull() ?: 1
                                  coordinator.submitQuestAction(actionType, questId, amount)
                              }
                              "CAMPAIGN" -> coordinator.advanceCampaign()
          '''.replace('                              ', '                    ')
          if text.count(dispatch_needle) != 1:
              raise SystemExit('MainActivity dispatch patch anchor mismatch')
          text = text.replace(dispatch_needle, dispatch_addition, 1)

          overlay_needle = '''        when (id) {
                      "INVENTORY" -> {
          '''.replace('                      ', '            ')
          overlay_addition = '''        when (id) {
                      "QUESTS" -> {
                          val view = GameplayScreen(this).apply {
                              onHome = { closeOverlay() }
                              onAction = { action -> dispatch(action) }
                          }
                          view.render(GamePresenter.presentQuests(world, coordinator.actorId))
                          setContentView(view)
                      }
                      "INVENTORY" -> {
          '''.replace('                      ', '            ')
          if text.count(overlay_needle) != 1:
              raise SystemExit('MainActivity overlay patch anchor mismatch')
          activity.write_text(text.replace(overlay_needle, overlay_addition, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/kotlin/grandlineduo/appshell/GameSessionCoordinator.kt app/src/main/kotlin/com/grandlineduo/app/MainActivity.kt
          git diff --cached --check
          git commit -m "feat: connect quest board to session and Android UI"
          git push origin HEAD:feature/quest-contract-system
