      - name: Commit restored project to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Project files already present; nothing to commit."
          else
            git commit -m "feat: import GRAND LINE DUO Android project"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Ensure Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
            if [ -z "$SDKMANAGER" ]; then
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            fi
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          echo "ANDROID_HOME=$ANDROID_HOME"
          gradle --version

      - name: Run core reliability tests
        run: bash tools/run-core-tests.sh

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GRAND-LINE-DUO-debug.apk
          (cd dist && sha256sum GRAND-LINE-DUO-debug.apk > GRAND-LINE-DUO-debug.apk.sha256)
          cat dist/GRAND-LINE-DUO-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grand-line-duo-debug-apk
          path: |
            dist/GRAND-LINE-DUO-debug.apk
            dist/GRAND-LINE-DUO-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
