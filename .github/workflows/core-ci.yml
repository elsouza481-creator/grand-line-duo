name: GRAND LINE DUO Core CI

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "tools/run-core-tests.sh"
      - ".github/workflows/core-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "core/**"
      - "tools/run-core-tests.sh"
      - ".github/workflows/core-ci.yml"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Kotlin compiler
        run: |
          set -euo pipefail
          if ! command -v kotlinc >/dev/null 2>&1; then
            curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
            unzip -q /tmp/kotlin.zip -d /tmp/kotlin
            echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          fi
      - name: Run core suite
        run: bash tools/run-core-tests.sh
