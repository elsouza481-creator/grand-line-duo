name: GRAND LINE DUO current source build

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "core/**"
      - "tools/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/main-source-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "core/**"
      - "tools/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/main-source-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Ensure Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ] && \
             [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" || \
              "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"
          fi
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Run core and gameplay tests
        run: bash tools/run-core-tests.sh

      - name: Assemble current debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare current APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GRAND-LINE-DUO-current.apk
          sha256sum dist/GRAND-LINE-DUO-current.apk > dist/GRAND-LINE-DUO-current.apk.sha256
          test -s dist/GRAND-LINE-DUO-current.apk
          cat dist/GRAND-LINE-DUO-current.apk.sha256

      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAND-LINE-DUO-current-APK
          path: |
            dist/GRAND-LINE-DUO-current.apk
            dist/GRAND-LINE-DUO-current.apk.sha256
          if-no-files-found: error
          retention-days: 30
