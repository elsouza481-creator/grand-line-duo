      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Ensure Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ] && [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" || "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"
          fi
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          if [ -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            echo "Using Android SDK android-37.0"
          else
            test -f "$ANDROID_HOME/platforms/android-37/android.jar"
            echo "Using Android SDK android-37"
          fi
          gradle --version

      - name: Run 272 core and gameplay tests
        working-directory: project
        run: bash tools/run-core-tests.sh

      - name: Assemble Android debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare verified APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp project/app/build/outputs/apk/debug/app-debug.apk dist/GRAND-LINE-DUO-1.0.0.apk
          sha256sum dist/GRAND-LINE-DUO-1.0.0.apk > dist/GRAND-LINE-DUO-1.0.0.apk.sha256
          test -s dist/GRAND-LINE-DUO-1.0.0.apk
          cat dist/GRAND-LINE-DUO-1.0.0.apk.sha256

      - name: Upload GRAND LINE DUO APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAND-LINE-DUO-1.0.0-APK
          path: |
            dist/GRAND-LINE-DUO-1.0.0.apk
            dist/GRAND-LINE-DUO-1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
