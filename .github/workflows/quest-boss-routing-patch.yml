name: Apply quest boss routing patch

on:
  push:
    branches: ["feature/quest-contract-system"]
    paths:
      - ".github/workflows/quest-boss-routing-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quest-contract-system
          fetch-depth: 0
      - name: Route quest boss gameplay commands
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core/src/main/kotlin/grandlineduo/game/network/StormglassGameplayCommandHandler.kt')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import grandlineduo.game.quest.QuestEngine\n',
              'import grandlineduo.game.quest.QuestEngine\nimport grandlineduo.game.quest.QuestBossCoordinator\n',
              'quest boss import',
          )

          replace_once(
              '    private val arcCombatCoordinator = ArcCombatCoordinator(hostReplica, snapshotStore, durableStore)\n',
              '''    private val arcCombatCoordinator = ArcCombatCoordinator(hostReplica, snapshotStore, durableStore)
    private val questBossCoordinator = QuestBossCoordinator(
        hostReplica = hostReplica,
        campaignSeed = seed,
        snapshotStore = snapshotStore,
        durableStore = durableStore,
    )
''',
              'quest boss coordinator',
          )

          replace_once(
              '''        if (command is GameplayWireCommand.QuestAction) {
            return applyQuestAction(before, command, fingerprint, hostTimestamp)
        }
''',
              '''        if (command is GameplayWireCommand.QuestAction) {
            if (command.actionType.equals("START_BOSS", ignoreCase = true)) {
                return questBossCoordinator.start(
                    command.commandId,
                    command.actorId,
                    command.questId,
                    hostTimestamp,
                )
            }
            return applyQuestAction(before, command, fingerprint, hostTimestamp)
        }
''',
              'quest action routing',
          )

          replace_once(
              '''            return arcCombatCoordinator.submitAction(
                command.commandId,
                command.actorId,
                type,
                hostTimestamp,
            )
''',
              '''            return if (before.worldFlags[QuestBossCoordinator.ACTIVE_QUEST_FLAG] != null) {
                questBossCoordinator.submitAction(
                    command.commandId,
                    command.actorId,
                    type,
                    hostTimestamp,
                )
            } else {
                arcCombatCoordinator.submitAction(
                    command.commandId,
                    command.actorId,
                    type,
                    hostTimestamp,
                )
            }
''',
              'combat routing',
          )

          replace_once(
              '''        val metadata = mutableMapOf(
            "meta.powerTechnique" to prepared.technique.id,
            "meta.powerEnergyCost" to prepared.technique.energyCost.toString(),
            "meta.powerBonus" to prepared.bonusDamage.toString(),
        )

        val nextWorld = if (poweredWorld.activeCombat != null) {
''',
              '''        val metadata = mutableMapOf(
            "meta.powerTechnique" to prepared.technique.id,
            "meta.powerEnergyCost" to prepared.technique.energyCost.toString(),
            "meta.powerBonus" to prepared.bonusDamage.toString(),
        )
        if (
            poweredWorld.activeCombat != null &&
            poweredWorld.worldFlags[QuestBossCoordinator.ACTIVE_QUEST_FLAG] != null
        ) {
            return questBossCoordinator.submitPreparedAction(
                commandId = command.commandId,
                playerId = command.actorId,
                actionType = prepared.combatAction,
                preparedWorld = poweredWorld,
                sourceFingerprint = fingerprint,
                metadata = metadata,
                hostTimestamp = hostTimestamp,
            )
        }

        val nextWorld = if (poweredWorld.activeCombat != null) {
''',
              'power routing',
          )

          path.write_text(text)
          PY
      - name: Commit routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/kotlin/grandlineduo/game/network/StormglassGameplayCommandHandler.kt
          git diff --cached --check
          git commit -m "feat: route quest boss combat and powers"
          git push origin HEAD:feature/quest-contract-system
