name: one-shot expand player codec

on:
  push:
    branches:
      - feature/class-mastery-persistence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/class-mastery-persistence
      - name: Expand player count codec bound
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('core/src/main/kotlin/grandlineduo/core/persistence/WorldStateCodec.kt')
          text = path.read_text()
          old = 'require(playerCount in 0..2) { "Invalid player count" }'
          new = 'require(playerCount in 0..4) { "Invalid player count" }'
          if old not in text:
              raise SystemExit('expected codec bound not found')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -F 'require(playerCount in 0..4) { "Invalid player count" }' core/src/main/kotlin/grandlineduo/core/persistence/WorldStateCodec.kt
      - name: Commit codec change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/kotlin/grandlineduo/core/persistence/WorldStateCodec.kt
          git commit -m 'fix: allow four players in world snapshots'
          git push origin HEAD:feature/class-mastery-persistence
