name: Apply solo AI terminal combat guard

on:
  push:
    branches: ["feature/quest-contract-system"]
    paths:
      - ".github/workflows/solo-ai-combat-guard-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quest-contract-system
          fetch-depth: 0
      - name: Guard terminal arc combat from AI fallthrough
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core/src/main/kotlin/grandlineduo/appshell/GameSessionCoordinator.kt')
          text = path.read_text()
          needle = '''            handler!!.handle(GameplayWireCommand.CombatAction(nextCommandId("ai-combat"), "p2", chosen.name), System.currentTimeMillis())
            return
        }

        val restored = StormglassPersistenceAdapter.decode(host.state)
'''
          replacement = '''            handler!!.handle(GameplayWireCommand.CombatAction(nextCommandId("ai-combat"), "p2", chosen.name), System.currentTimeMillis())
            return
        }
        if (activeArcCombat != null) return

        val restored = StormglassPersistenceAdapter.decode(host.state)
'''
          if text.count(needle) != 1:
              raise SystemExit('autoPlayCompanion patch anchor mismatch')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/kotlin/grandlineduo/appshell/GameSessionCoordinator.kt
          git diff --cached --check
          git commit -m "fix: stop solo AI after terminal boss combat"
          git push origin HEAD:feature/quest-contract-system
